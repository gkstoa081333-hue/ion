<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26453B">
<meta name="robots" content="noindex,nofollow">
<title>이온 신청관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ===== 이온 디자인 토큰 (매칭앱 index.html 과 동일) ===== */
:root{
  --green:#26453B; --green-2:#3A5C50; --green-ink:#1A3029;
  --cream:#F6F1E7; --paper:#FFFDF8; --sand:#EFE7D6;
  --line:#E9E1CF; --line-2:#E4DCCB; --line-3:#F0EADC;
  --gold:#D9C8A0; --gold-d:#B08A3E; --gold-t:#7A5C22; --gold-soft:#EAD9A8; --gold-ink:#5A431A;
  --muted:#5C6B63; --ink-2:#3F5249; --mint:#E3EAE6; --sub:#C9D6CF;
  --danger:#9B3B2A;
  --round:'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body:'Gowun Dodum', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--green);font-family:var(--body);-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
.wrap{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
.wrap.narrow{max-width:480px;padding:20px 22px}
.dark{background:var(--green);color:var(--cream)}
.round{font-family:var(--round);font-weight:400}
.brand{font-family:var(--round);font-size:20px;letter-spacing:.12em}
.eyebrow{font-family:var(--round);font-size:13px;letter-spacing:.1em;color:var(--gold-t)}
.dark .eyebrow,.card.hero .eyebrow{color:var(--gold)}
.h1{font-family:var(--round);font-weight:400;font-size:30px;line-height:1.38;margin:0}
.p{margin:0;font-size:15px;line-height:1.7;color:var(--muted)}
.dark .p{color:var(--sub)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.card.hero .small{color:var(--sub)}
.spacer{flex-grow:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;border-radius:12px;color:inherit}
.pill{padding:6px 14px;border:1px solid var(--gold);border-radius:999px;font-size:12px;color:var(--gold);letter-spacing:.04em}
.pill.on-cream{border-color:var(--gold-d);color:var(--gold-t)}
.center{text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:var(--cream);font-family:var(--round);font-size:17px;text-decoration:none;padding:0 18px}
.btn:disabled{background:var(--line-2);color:var(--muted);cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.line{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn.soft{background:var(--sand);color:var(--green)}
.btn.danger{background:transparent;border:2px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn:active{transform:translateY(1px)}
.mini{min-height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--sand);color:var(--green);font-family:var(--round);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.mini.go{background:var(--green);color:var(--cream)}
.mini.gold{background:var(--gold);color:var(--green)}
.mini.del{background:transparent;color:var(--danger)}
.mini.on-dark{background:rgba(255,255,255,.12);color:var(--cream)}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--ink-2)}
.dark .field label{color:#E4E9E5}
.input{height:50px;padding:0 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--paper);color:var(--green);width:100%}
.dark .input{border:0}
textarea.input{height:auto;min-height:150px;padding:14px 16px;line-height:1.6;resize:vertical}
.input:focus{outline:3px solid var(--gold);outline-offset:1px}
.err{color:#F3C6BC;font-size:14px;min-height:20px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.hero{background:var(--green);color:var(--cream);border:0}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-family:var(--round);font-size:12px;white-space:nowrap}
.chip.r1{background:var(--green);color:var(--cream)}
.chip.ok{background:var(--mint);color:var(--green)}
.chip.wait{background:var(--gold-soft);color:var(--gold-ink)}
.chip.mute{background:var(--sand);color:var(--ink-2)}
.chip.bad{background:#F3DED8;color:var(--danger)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chipbtn{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-family:var(--round);font-size:14px;color:var(--ink-2);white-space:nowrap}
.chipbtn.on{background:var(--green);border-color:var(--green);color:var(--cream)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:14px;background:var(--sand)}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-family:var(--round);font-size:13px;color:var(--ink-2)}
.tab.on{background:var(--green);color:var(--cream)}
.bar{height:8px;border-radius:999px;background:var(--green-2);overflow:hidden;display:flex}
.bar>i{display:block;height:8px;background:var(--gold)}
.bar>b{display:block;height:8px;background:rgba(217,200,160,.45)}
.slotline{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.slotline:first-of-type{border-top:0;padding-top:4px}
.gline{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-3);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex-shrink:0}
.kv span:last-child{text-align:right;word-break:break-all}
.pn{font-family:var(--round);font-size:21px}
.late{color:var(--danger)}
.log{font-size:12px;color:var(--muted);line-height:1.5}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.demo{position:sticky;top:0;z-index:5;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;text-align:center;padding:8px 12px}
.spin{width:28px;height:28px;border:3px solid var(--line-2);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;margin:40vh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green-ink);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(26,48,41,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--cream);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.modal-bg{align-items:center}}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sgrid .input{height:46px;padding:0 12px}
</style>
</head>
<body>
<div id="app"><div class="spin" aria-label="불러오는 중"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="ion-store.js?v=20261029d"></script>
<script>
/* =====================================================================
   이온 신청관리 (운영진 전용 · 휴대폰용)
   - 매칭앱과 같은 운영진 계정(Firebase)으로 로그인
   - 명단은 Firebase에 실시간 저장 · 두 운영진 화면이 동시에 갱신
   - 화면을 열 때마다 미입금 자동취소 · 대기 자동배정 · 정원 재계산
   - 주소 끝에 ?demo 를 붙이면 데모 모드
   ===================================================================== */

/* ---------- 문자 문구 (자유롭게 고쳐 쓰세요) ---------- */
const TPL = {
  pay: { label: '입금 안내', for: ['pending'], make: (r, x) => `[이온] ${r.name}님, ${x.when} 신청 감사합니다 🙂

입금 계좌: ${x.account}
금액: ${x.fee}원
입금자명: ${r.payName} (꼭 이대로 적어주세요)
입금 기한: ${x.deadline}

기한까지 입금이 확인되지 않으면 자동 취소돼요.` },
  promote: { label: '자리 확보(승격)', for: ['pending'], make: (r, x) => `[이온] ${r.name}님, 기다려 주셔서 감사해요! ${x.when} 자리가 생겼어요 🙌

입금 계좌: ${x.account}
금액: ${x.fee}원
입금자명: ${r.payName}
입금 기한: ${x.deadline}

기한이 지나면 다음 대기자분께 순서가 넘어가요.` },
  confirm: { label: '참가 확정', for: ['confirmed'], make: (r, x) => `[이온] ${r.name}님, 입금 확인되어 참가가 확정되었어요 🎉

일정: ${x.when}
장소: ${x.place}
신청번호: ${r.id}

자세한 장소와 안내는 행사 전날 다시 보내드릴게요.` },
  d1: { label: 'D-1 안내', for: ['confirmed'], make: (r, x) => `[이온] ${r.name}님, 내일 뵙겠습니다 🙂

일정: ${x.when}
장소: ${x.place}

· 10분 전까지 도착해 주세요. 입구에서 번호표를 드려요.
· 마지막에 테이블 QR로 마음에 남은 분을 골라주시면 돼요.
· 늦거나 못 오시게 되면 이 번호로 꼭 연락 주세요.` },
  wait: { label: '대기 안내', for: ['waiting'], make: (r, x) => `[이온] ${r.name}님, ${x.when} 타임이 마감되어 대기 ${x.waitNo}번으로 등록되었어요.

자리가 생기면 바로 연락드릴게요. 지금은 입금하지 않으셔도 돼요.` },
  cancel: { label: '취소 안내', for: ['cancelled', 'refunded'], make: (r, x) => `[이온] ${r.name}님, ${x.when} 신청이 취소되었어요.

다시 참여를 원하시면 신청 페이지에서 새로 신청해 주세요. 감사합니다.` }
};

/* ---------- 유틸 ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const won = n => Number(n || 0).toLocaleString('ko-KR');
const DEMO = IonStore.demo;
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const G = { M: '형제', F: '자매' };
const ICON = {
  out: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  msg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-5.6A8 8 0 1 1 21 12z"/></svg>',
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>'
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
async function copyText(text, msg = '복사했어요') {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
  toast(msg);
}
function dt(ms, withDay = false) {
  if (!ms) return '';
  const d = new Date(ms); if (isNaN(d)) return '';
  return `${d.getMonth() + 1}/${d.getDate()}${withDay ? '(' + '일월화수목금토'[d.getDay()] + ')' : ''} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function leftText(ms) {
  const d = ms - Date.now();
  if (!ms) return '';
  if (d <= 0) return '기한 지남';
  const h = Math.floor(d / 3600e3), m = Math.floor(d % 3600e3 / 60e3);
  return h ? `${h}시간 ${m}분 남음` : `${m}분 남음`;
}
function confirmBox(title, body, okText = '확인', danger = false) {
  return new Promise(resolve => {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <p class="round" style="margin:0;font-size:19px">${esc(title)}</p>${body ? `<p class="p" style="font-size:14px">${esc(body)}</p>` : ''}
      <div class="row" style="flex-wrap:nowrap"><button class="btn soft" data-c="0">취소</button><button class="btn ${danger ? 'danger' : ''}" data-c="1">${esc(okText)}</button></div></div></div>`;
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { m.innerHTML = ''; resolve(b.dataset.c === '1'); });
  });
}
const payNameOf = r => String(r.name).replace(/\s/g, '').slice(0, 4) + String(Number(digits(r.id)) % 1000).padStart(3, '0');
const addLog = (r, what) => (r.log ? r.log + ' / ' : '') + dt(Date.now()) + ' ' + what;

/* ---------- 상태 ---------- */
const A = { phase: 'loading', authErr: '', busy: false, data: null, view: 'list', cohort: lsGet('ion_admin_cohort') || '', tab: 'pending', q: '', open: {}, unsub: null, lastMaint: 0, draft: null, reviews: {}, unsubR: null, rCohort: '' };
const apps = () => Object.values((A.data && A.data.apps) || {});
const slots = () => Object.entries((A.data && A.data.slots) || {}).map(([id, s]) => ({ id, ...s })).sort((a, b) => (a.order || 0) - (b.order || 0));
const conf = () => (A.data && A.data.config) || {};

function start() {
  IonStore.onAuth(st => {
    if (st.admin) {
      if (!A.unsubR) A.unsubR = IonStore.watch('reviews', v => { A.reviews = v || {}; if (A.view === 'reviews') render(); });
      if (!A.unsub) A.unsub = IonStore.watch('apply', v => { A.data = v || {}; A.phase = v && v.config ? 'main' : 'setup'; fixCohort(); render(); maintain(); }, e => { A.phase = 'login'; A.authErr = '명단을 불러오지 못했어요. 규칙 게시 여부를 확인해 주세요.'; render(); });
    } else {
      if (A.unsub) { A.unsub(); A.unsub = null; }
      if (A.unsubR) { A.unsubR(); A.unsubR = null; }
      A.phase = 'login';
      if (st.user && !st.user.isAnonymous) A.authErr = '운영진으로 등록되지 않은 계정이에요.';
      render();
    }
  });
}
function cohortList() {
  const out = []; slots().forEach(s => { if (!out.includes(s.cohort)) out.push(s.cohort); });
  apps().forEach(r => { if (r.cohort && !out.includes(r.cohort)) out.push(r.cohort); });
  return out;
}
function fixCohort() { const c = cohortList(); if (!c.includes(A.cohort)) A.cohort = c[0] || ''; }

/* ---------- 자동 정리: 미입금 취소 · 대기 배정 · 정원 재계산 ---------- */
function plan(list, extra = {}) {
  // list: 변경을 반영한 신청서 배열(복사본). 반환: apply 아래 다중 경로 업데이트
  const up = { ...extra };
  const byId = {}; list.forEach(r => { byId[r.id] = r; });
  const now = Date.now();
  const touched = new Set(Object.keys(extra).filter(k => k.startsWith('apps/')).map(k => k.split('/')[1]));
  const promoted = [], expired = [];
  list.forEach(r => {
    if (r.status === 'pending' && r.deadline && r.deadline < now) {
      r.status = 'cancelled'; r.memo = [r.memo, '미입금 자동취소 ' + dt(now)].filter(Boolean).join(' / ');
      touched.add(r.id); expired.push(r);
    }
  });
  slots().forEach(s => ['M', 'F'].forEach(g => {
    const mine = list.filter(r => r.slotId === s.id && r.gender === g);
    let held = mine.filter(r => ION_HOLDING.includes(r.status)).length;
    mine.filter(r => r.status === 'waiting').sort((a, b) => a.at - b.at).forEach(r => {
      if (held >= (s.cap?.[g] || 0)) return;
      r.status = 'pending'; r.deadline = now + (Number(conf().promoteHours) || 12) * 3600e3;
      if (!r.payName) r.payName = payNameOf(r);
      r.log = addLog(r, '승격'); touched.add(r.id); promoted.push(r); held++;
    });
    const cur = ((A.data.counts || {})[s.id] || {})[g] || 0;
    if (cur !== held) up[`counts/${s.id}/${g}`] = held;
  }));
  touched.forEach(id => {
    const r = byId[id]; const prev = (A.data.apps || {})[id] || {};
    ['status', 'deadline', 'payName', 'log', 'memo', 'confirmedAt'].forEach(k => { if (r[k] !== undefined && r[k] !== prev[k]) up[`apps/${id}/${k}`] = r[k]; });
    // 중복 방지 표시: 취소·환불이면 풀어서 재신청 가능하게, 다시 살리면 복구
    if (r.phoneKey) {
      const ph = `phones/${r.cohort}/${r.phoneKey}`;
      const on = ((A.data.phones || {})[r.cohort] || {})[r.phoneKey];
      if (['cancelled', 'refunded'].includes(r.status) && on === r.id) up[ph] = null;
      if (!['cancelled', 'refunded'].includes(r.status) && !on) up[ph] = r.id;
    }
  });
  return { up, promoted, expired };
}
async function maintain(force) {
  if (!A.data || !A.data.config) return;
  if (!force && Date.now() - A.lastMaint < 20000) return;
  A.lastMaint = Date.now();
  const { up, promoted, expired } = plan(apps().map(r => ({ ...r })));
  if (!Object.keys(up).length) return;
  try {
    await IonStore.update('apply', up);
    if (expired.length || promoted.length) toast(`미입금 자동취소 ${expired.length}건 · 대기 배정 ${promoted.length}건${promoted.length ? ' · 입금 안내를 보내주세요' : ''}`);
  } catch (e) { console.error(e); }
}
async function changeStatus(id, to, memo) {
  const list = apps().map(r => ({ ...r }));
  const r = list.find(x => x.id === id); if (!r) return false;
  const from = r.status;
  if (to) {
    r.status = to;
    if (to === 'confirmed' && !r.confirmedAt) r.confirmedAt = Date.now();
    if (to === 'pending') {
      r.deadline = Date.now() + (Number(conf().promoteHours) || 12) * 3600e3;
      if (!r.payName) r.payName = payNameOf(r);
      if (from === 'waiting') r.log = addLog(r, '승격');
    }
  }
  if (memo !== undefined) r.memo = memo;
  const { up, promoted } = plan(list, { [`apps/${id}/status`]: r.status });
  try {
    await IonStore.update('apply', up);
    const others = promoted.filter(p => p.id !== id);
    if (others.length) toast(`대기 ${others.length}명이 자리 배정됐어요 · 입금 안내를 보내주세요`);
    return true;
  } catch (e) { console.error(e); toast('저장하지 못했어요: ' + e.message); return false; }
}

      <div class="between"><span class="round">${esc(s.cohort || '새 타임')} · ${esc(s.time || '')}</span>
        <label class="row small" style="gap:6px"><input type="checkbox" data-s="${i}" data-f="public" ${s.public ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--green)">신청 페이지에 공개</label></div>
      <div class="sgrid">
        ${sf(i, 'cohort', '기수', s.cohort, '3기')}${sf(i, 'date', '날짜', s.date, '11/14(토)')}
        ${sf(i, 'time', '시간', s.time, '15:00~17:00')}${sf(i, 'place', '장소', s.place, '대전 괴정동 카페')}
        ${sf(i, 'capM', '형제 정원', s.cap.M, '6', 'number')}${sf(i, 'capF', '자매 정원', s.cap.F, '6', 'number')}
      </div>
      <div class="row" style="justify-content:flex-end">${hasApps(s.id) ? '<span class="small">신청자가 있어 삭제할 수 없어요 (비공개로 바꾸세요)</span>' : `<button class="mini del" data-act="delslot" data-v="${i}">이 타임 삭제</button>`}</div>
    </div>`).join('');
  return `<div class="wrap">
    <div class="top"><button class="icon-btn" data-act="back" aria-label="목록으로" style="margin-left:-10px">${ICON.back}</button><span class="brand" style="font-size:18px">설정</span><span style="width:40px"></span></div>
    <div class="stack" style="gap:16px;margin-top:8px">
      <div class="card stack" style="gap:14px">
        <div class="between"><span class="round" style="font-size:17px">모집 상태</span>
          <div class="chips">${[[true, '모집 중'], [false, '닫힘']].map(([v, l]) => `<button class="chipbtn ${d.config.open === v ? 'on' : ''}" data-act="open" data-v="${v}">${l}</button>`).join('')}</div></div>
        ${cf('account', '입금 계좌', d.config.account)}
        <div class="sgrid">${cf('fee', '참가비(원)', d.config.fee, 'number')}${cf('contact', '문의처', d.config.contact)}
          ${cf('payHours', '입금 기한(시간)', d.config.payHours, 'number')}${cf('promoteHours', '대기→배정 후 기한(시간)', d.config.promoteHours, 'number')}</div>
        <div class="field"><label for="c-refund">환불 규정 (신청 페이지에 표시)</label><textarea id="c-refund" class="input" data-c="refund" style="min-height:120px">${esc(d.config.refund)}</textarea></div>
      </div>
      <div class="between"><span class="eyebrow">기수 · 타임</span><button class="mini" data-act="addslot">+ 타임 추가</button></div>
      ${sl}
      <button class="btn" data-act="save" ${A.busy ? 'disabled' : ''}>${A.busy ? '저장 중…' : '저장하기'}</button>
      <p class="small center">신청 페이지: <a href="apply.html">apply.html</a> · 매칭앱: <a href="index.html#admin">index.html#admin</a></p>
    </div>
    <div class="spacer" style="min-height:20px"></div></div>`;
}
const sf = (i, f, label, v, ph, type = 'text') => `<div class="field"><label for="s${i}${f}">${label}</label><input id="s${i}${f}" class="input" type="${type}" data-s="${i}" data-f="${f}" value="${esc(v ?? '')}" placeholder="${ph}" ${type === 'number' ? 'inputmode="numeric" min="0"' : ''}></div>`;
const cf = (f, label, v, type = 'text') => `<div class="field"><label for="c-${f}">${label}</label><input id="c-${f}" class="input" type="${type}" data-c="${f}" value="${esc(v ?? '')}" ${type === 'number' ? 'inputmode="numeric" min="0"' : ''}></div>`;
const hasApps = sid => apps().some(r => r.slotId === sid);
function openSettings() {
  A.draft = { config: { ...ION_DEFAULTS.config, ...conf() }, slots: slots().map(s => ({ ...s, cap: { M: s.cap?.M || 0, F: s.cap?.F || 0 } })) };
  A.view = 'settings'; render(); window.scrollTo(0, 0);
}
async function saveSettings() {
  const d = A.draft; const c = d.config;
  if (!String(c.account).trim()) return toast('입금 계좌를 입력해 주세요');
  for (const s of d.slots) if (!s.cohort || !s.date || !s.time) return toast('타임마다 기수·날짜·시간을 입력해 주세요');
  const outSlots = {};
  d.slots.forEach((s, i) => { outSlots[s.id] = { cohort: s.cohort.trim(), date: s.date.trim(), time: s.time.trim(), place: (s.place || '').trim(), cap: { M: Number(s.cap.M) || 0, F: Number(s.cap.F) || 0 }, public: !!s.public, order: i + 1 }; });
  const removed = slots().filter(s => !outSlots[s.id]).map(s => s.id);
  const up = { config: { open: !!c.open, fee: Number(c.fee) || 0, account: String(c.account).trim(), payHours: Number(c.payHours) || 24, promoteHours: Number(c.promoteHours) || 12, contact: String(c.contact || '').trim(), refund: String(c.refund || '') } };
  Object.entries(outSlots).forEach(([id, s]) => { up['slots/' + id] = s; });
  removed.forEach(id => { up['slots/' + id] = null; up['counts/' + id] = null; });
  A.busy = true; render();
  try { await IonStore.update('apply', up); toast('저장했어요'); A.view = 'list'; A.lastMaint = 0; maintain(true); }
  catch (e) { toast('저장하지 못했어요: ' + e.message); }
  A.busy = false; render();
}

/* ---------- 문자·카톡 모달 ---------- */
function ctx(r) {
  return { when: `${r.cohort} ${r.date} ${r.time}`, place: r.place || '추후 안내', account: conf().account, fee: won(conf().fee), deadline: dt(r.deadline, true) + '까지', waitNo: waitNo(r) };
}
function openMsg(id, pick) {
  const r = (A.data.apps || {})[id]; if (!r) return;
  const keys = Object.keys(TPL).filter(k => TPL[k].for.includes(r.status));
  const k = pick || (r.status === 'pending' && String(r.log).includes('승격') && !String(r.log).includes('자리 확보') ? 'promote' : keys[0]);
  const text = TPL[k].make(r, ctx(r));
  const smsHref = t => `sms:${digits(r.phone)}${IOS ? '&' : '?'}body=${encodeURIComponent(t)}`;
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-bg" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="문자 보내기">
    <div class="between"><span class="round" style="font-size:19px">${esc(r.name)}님께 보내기</span><span class="small">${esc(r.phone)}</span></div>
    <div class="chips">${keys.map(x => `<button class="chipbtn ${x === k ? 'on' : ''}" data-tpl="${x}">${TPL[x].label}</button>`).join('')}</div>
    <textarea class="input" id="msg-text" aria-label="보낼 문구" style="min-height:240px">${esc(text)}</textarea>
    <a class="btn" id="msg-sms" href="${esc(smsHref(text))}">${ICON.msg}문자 앱으로 보내기</a>
    <button class="btn soft" id="msg-copy">${ICON.copy}문구 복사 (카톡용)</button>
    <button class="btn line" data-close="1" style="min-height:48px">닫기</button></div></div>`;
  const ta = m.querySelector('#msg-text');
  ta.addEventListener('input', () => { m.querySelector('#msg-sms').href = smsHref(ta.value); });
  m.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => openMsg(id, b.dataset.tpl));
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = ev => { if (ev.target === b) m.innerHTML = ''; });
  m.querySelector('#msg-sms').addEventListener('click', () => { logSend(id, TPL[k].label + ' 문자'); setTimeout(() => { m.innerHTML = ''; }, 300); });
  m.querySelector('#msg-copy').onclick = async () => { await copyText(ta.value, '복사했어요 · 카톡에 붙여넣어 주세요'); logSend(id, TPL[k].label + ' 카톡'); m.innerHTML = ''; };
}
async function logSend(id, what) {
  const r = (A.data.apps || {})[id]; if (!r) return;
  try { await IonStore.update('apply', { [`apps/${id}/log`]: addLog(r, what) }); } catch (e) { toast('발송 기록 저장 실패'); }
}

/* ---------- 내보내기 ---------- */
function rosterText(slotId) {
  const rows = apps().filter(r => r.slotId === slotId && r.status === 'confirmed').sort((a, b) => (a.gender === b.gender ? a.at - b.at : a.gender === 'M' ? -1 : 1));
  return { n: rows.length, text: rows.map(r => `${G[r.gender]}\t${r.name}\t${r.phone}`).join('\n') };
}
function downloadCSV() {
  const cols = [['신청번호', 'id'], ['상태', r => ION_STATUS[r.status]], ['기수', 'cohort'], ['날짜', 'date'], ['타임', 'time'], ['성별', r => G[r.gender]], ['이름', 'name'],
    ['출생연도', 'birthYear'], ['연락처', 'phone'], ['거주지역', 'region'], ['직업', 'job'], ['출석교회', 'church'], ['교회위치', 'churchAddr'], ['교단', 'denom'],
    ['신앙생활기간', 'faithYears'], ['출석여부', 'attend'], ['유입경로', 'source'], ['요청사항', 'note'], ['소식수신', 'newsAgree'], ['입금자명', 'payName'],
    ['신청일시', r => dt(r.at, true)], ['입금기한', r => dt(r.deadline)], ['확정일시', r => dt(r.confirmedAt)], ['발송기록', 'log'], ['메모', 'memo']];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = rowsOf(A.cohort).sort((a, b) => a.at - b.at);
  const csv = '﻿' + [cols.map(c => cell(c[0])).join(',')].concat(rows.map(r => cols.map(([, f]) => cell(typeof f === 'function' ? f(r) : r[f])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `이온_${A.cohort}_신청명단_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function demoSeed() {
  const people = [['M', '김도윤', 1994, 'pending'], ['M', '박서준', 1991, 'confirmed'], ['F', '이하은', 1996, 'confirmed'], ['F', '최지우', 1993, 'pending'],
    ['M', '정민재', 1990, 'confirmed'], ['F', '한서연', 1995, 'confirmed'], ['F', '오유나', 1997, 'waiting'], ['M', '윤시우', 1992, 'pending']];
  const ss = slots().filter(s => s.cohort === (A.cohort || '3기'));
  let seq = (await IonStore.get('apply/seq')) || 0; const up = {};
  people.forEach(([g, name, y, st], i) => {
    seq++; const id = 'ION-' + String(seq).padStart(4, '0'); const s = ss[i % ss.length];
    up['apps/' + id] = { id, uid: 'demo', at: Date.now() - (10 - i) * 3600e3, status: st, cohort: s.cohort, slotId: s.id, date: s.date, time: s.time, place: s.place, gender: g, name, birthYear: y,
      phone: '010-1234-' + (1000 + seq), region: '대전 서구', job: '회사원', church: '예시교회', churchAddr: '', denom: '장로교', faithYears: '10년 이상', attend: '매주 출석', source: '인스타그램',
      note: '', newsAgree: '동의합니다', payName: st === 'waiting' ? '' : name + String(seq % 1000).padStart(3, '0'), deadline: st === 'pending' ? Date.now() + (i + 2) * 3600e3 : 0,
      confirmedAt: st === 'confirmed' ? Date.now() : 0, phoneKey: 'demo' + seq, log: '', memo: '' };
  });
  up.seq = seq;
  await IonStore.update('apply', up); A.lastMaint = 0; maintain(true);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') {
    // 화면을 다시 그리기 전에 입력값을 먼저 읽어야 함 (다시 그리면 입력칸이 비워짐)
    A.email = (document.getElementById('em').value || '').replace(/\s/g, '');
    const pw = document.getElementById('pw').value;
    A.busy = true; A.authErr = ''; render();
    try { await IonStore.signIn(A.email, pw); }
    catch (err) {
      const c = err.code || '';
      A.authErr = c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login') ? '이메일 또는 비밀번호가 맞지 않아요. 기억이 안 나면 아래 재설정 메일을 받아주세요.'
        : c.includes('too-many-requests') ? '로그인 시도가 많아 잠시 막혔어요. 몇 분 뒤 다시 시도하거나 비밀번호를 재설정해 주세요.'
        : c.includes('invalid-email') ? `이메일 형식이 맞지 않아요. 입력값: "${A.email}" (예: ion_1004@naver.com)`
        : c.includes('network') ? '인터넷 연결을 확인해 주세요.'
        : '로그인하지 못했어요 (' + (c || err.message) + ')';
    }
    A.busy = false; render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k === 'q') { A.q = t.value; render(); return; }
  if (A.view === 'settings' && A.draft) {
    if (t.dataset.c) A.draft.config[t.dataset.c] = t.value;
    if (t.dataset.s !== undefined && t.dataset.f) {
      const s = A.draft.slots[Number(t.dataset.s)]; const f = t.dataset.f;
      if (f === 'public') s.public = t.checked; else if (f === 'capM') s.cap.M = t.value; else if (f === 'capF') s.cap.F = t.value; else s[f] = t.value;
    }
  }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const row = id => (A.data.apps || {})[id];
  if (act === 'logout') { await IonStore.signOut(); }
  else if (act === 'reset') {
    const em = (document.getElementById('em').value || '').replace(/\s/g, ''); A.email = em;
    if (!em) { A.authErr = '이메일을 먼저 입력해 주세요.'; render(); return; }
    try { await (IonStore.resetPassword ? IonStore.resetPassword(em) : firebase.auth().sendPasswordResetEmail(em)); A.authErr = em + ' 으로 재설정 메일을 보냈어요. 메일의 링크에서 새 비밀번호를 정한 뒤 로그인해 주세요. (스팸함도 확인)'; }
    catch (e) { A.authErr = '재설정 메일을 보내지 못했어요 (' + (e.code || e.message) + ')'; }
    render(); const el = document.getElementById('em'); if (el) el.value = em;
  }
  else if (act === 'init') { await IonStore.update('apply', { config: ION_DEFAULTS.config, slots: ION_DEFAULTS.slots }); toast('준비됐어요'); }
  else if (act === 'settings') openSettings();
  else if (act === 'reviews') { A.view = 'reviews'; render(); window.scrollTo(0, 0); }
  else if (act === 'rcohort') { A.rCohort = v; render(); }
  else if (act === 'revlink') { const s = slots().find(x => x.id === v); copyText(REV_URL(s.cohort, s.time), '후기 링크를 복사했어요'); }
  else if (act === 'rcopy') { const r = A.reviews[v]; copyText(`"${r.felt}"\n\n기억에 남는 순간: ${r.moment}\n\n— ${r.label}, 이온 ${r.cohort} 참가자`, '홍보 문구를 복사했어요'); }
  else if (act === 'rcsv') reviewCSV();
  else if (act === 'back') { A.view = 'list'; render(); }
  else if (act === 'open') { A.draft.config.open = v === 'true'; render(); }
  else if (act === 'addslot') { const last = A.draft.slots[A.draft.slots.length - 1] || {}; A.draft.slots.push({ id: 's' + Date.now().toString(36), cohort: last.cohort || '', date: last.date || '', time: '', place: last.place || '', cap: { M: 6, F: 6 }, public: true }); render(); }
  else if (act === 'delslot') { A.draft.slots.splice(Number(v), 1); render(); }
  else if (act === 'save') saveSettings();
  else if (act === 'cohort') { A.cohort = v; lsSet('ion_admin_cohort', v); render(); }
  else if (act === 'tab') { A.tab = v; render(); }
  else if (act === 'toggle') { A.open[v] = !A.open[v]; render(); }
  else if (act === 'msg') openMsg(v);
  else if (act === 'confirm') {
    const r = row(v);
    if (!(await confirmBox(`${r.payName} 입금확인`, `${r.name}님을 확정으로 바꿀까요? 확정 문자 창이 이어서 열려요.`, '입금확인'))) return;
    if (await changeStatus(v, 'confirmed')) { A.tab = 'confirmed'; render(); openMsg(v, 'confirm'); }
  }
  else if (act === 'promote') {
    const r = row(v);
    if (!(await confirmBox(`${r.name}님 자리 배정`, '대기에서 입금대기로 올리고 입금자명과 기한을 새로 만들어요. 정원을 넘길 수 있으니 현황을 확인해 주세요.', '자리 배정'))) return;
    if (await changeStatus(v, 'pending')) { A.tab = 'pending'; render(); openMsg(v, 'promote'); }
  }
  else if (act === 'cancel') { const r = row(v); if (await confirmBox(`${r.name}님 취소 처리`, '자리가 비면 같은 타임 대기 1번이 자동으로 입금대기가 돼요.', '취소 처리', true)) changeStatus(v, 'cancelled'); }
  else if (act === 'refund') { const r = row(v); if (await confirmBox(`${r.name}님 환불 처리`, '계좌이체로 환불한 뒤 눌러주세요. 대기자가 있으면 자동 배정돼요.', '환불 처리', true)) changeStatus(v, 'refunded'); }
  else if (act === 'restore') { if (await confirmBox('입금대기로 되돌릴까요?', '입금 기한이 새로 잡혀요.', '되돌리기')) changeStatus(v, 'pending'); }
  else if (act === 'memo') { const ta = document.querySelector(`[data-memo="${v}"]`); if (await changeStatus(v, '', ta ? ta.value : '')) toast('메모를 저장했어요'); }
  else if (act === 'roster') { const { n, text } = rosterText(v); if (!n) return toast('이 타임에 확정자가 아직 없어요'); copyText(text, `확정 ${n}명 복사 · 매칭앱 참가자 탭 › 붙여넣기에 넣어주세요`); }
  else if (act === 'csv') downloadCSV();
  else if (act === 'seed') demoSeed();
  else if (act === 'wipe') { if (await confirmBox('데모 데이터를 지울까요?', '이 브라우저의 데모 데이터만 지워져요.', '지우기', true)) IonStore.resetDemo(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') maintain(true); });
setInterval(() => { if (A.phase === 'main' && A.view === 'list' && document.visibilityState === 'visible' && !document.getElementById('modal').innerHTML) { maintain(); render(); } }, 60000);

start();
</script>
</body>
</html>
