<!doctype html>
<html lang="ko">
<head>

<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
/* ===== 이온 디자인 토큰 (매칭앱 index.html 과 동일) ===== */
:root{
  --green:#26453B; --green-2:#3A5C50; --green-ink:#1A3029;
  --cream:#F6F1E7; --paper:#FFFDF8; --sand:#EFE7D6;
  --line:#E9E1CF; --line-2:#E4DCCB; --line-3:#F0EADC;
  --gold:#D9C8A0; --gold-d:#B08A3E; --gold-t:#7A5C22; --gold-soft:#EAD9A8; --gold-ink:#5A431A;
  --muted:#5C6B63; --ink-2:#3F5249; --mint:#E3EAE6; --sub:#C9D6CF;
  --danger:#9B3B2A;
  --round:'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body:'Gowun Dodum', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--green);font-family:var(--body);-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
.wrap{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
.wrap.narrow{max-width:480px;padding:20px 22px}
.dark{background:var(--green);color:var(--cream)}
.round{font-family:var(--round);font-weight:400}
.brand{font-family:var(--round);font-size:20px;letter-spacing:.12em}
.eyebrow{font-family:var(--round);font-size:13px;letter-spacing:.1em;color:var(--gold-t)}
.dark .eyebrow,.card.hero .eyebrow{color:var(--gold)}
.h1{font-family:var(--round);font-weight:400;font-size:30px;line-height:1.38;margin:0}
.p{margin:0;font-size:15px;line-height:1.7;color:var(--muted)}
.dark .p{color:var(--sub)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.card.hero .small{color:var(--sub)}
.spacer{flex-grow:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;border-radius:12px;color:inherit}
.pill{padding:6px 14px;border:1px solid var(--gold);border-radius:999px;font-size:12px;color:var(--gold);letter-spacing:.04em}
.pill.on-cream{border-color:var(--gold-d);color:var(--gold-t)}
.center{text-align:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:var(--cream);font-family:var(--round);font-size:17px;text-decoration:none;padding:0 18px}
.btn:disabled{background:var(--line-2);color:var(--muted);cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.line{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn.soft{background:var(--sand);color:var(--green)}
.btn.danger{background:transparent;border:2px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn:active{transform:translateY(1px)}
.mini{min-height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--sand);color:var(--green);font-family:var(--round);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.mini.go{background:var(--green);color:var(--cream)}
.mini.gold{background:var(--gold);color:var(--green)}
.mini.del{background:transparent;color:var(--danger)}
.mini.on-dark{background:rgba(255,255,255,.12);color:var(--cream)}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--ink-2)}
.dark .field label{color:#E4E9E5}
.input{height:50px;padding:0 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--paper);color:var(--green);width:100%}
.dark .input{border:0}
textarea.input{height:auto;min-height:150px;padding:14px 16px;line-height:1.6;resize:vertical}
.input:focus{outline:3px solid var(--gold);outline-offset:1px}
.err{color:#F3C6BC;font-size:14px;min-height:20px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.hero{background:var(--green);color:var(--cream);border:0}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-family:var(--round);font-size:12px;white-space:nowrap}
.chip.r1{background:var(--green);color:var(--cream)}
.chip.ok{background:var(--mint);color:var(--green)}
.chip.wait{background:var(--gold-soft);color:var(--gold-ink)}
.chip.mute{background:var(--sand);color:var(--ink-2)}
.chip.bad{background:#F3DED8;color:var(--danger)}
.chip.warn{background:#FCEFC7;color:#7A5300}
.conflict{border-left:0;background:#FFF8E6;border:1px solid #EBCB7A;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.55;color:#5A4300}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chipbtn{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-family:var(--round);font-size:14px;color:var(--ink-2);white-space:nowrap}
.chipbtn.on{background:var(--green);border-color:var(--green);color:var(--cream)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:14px;background:var(--sand)}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-family:var(--round);font-size:13px;color:var(--ink-2)}
.tab.on{background:var(--green);color:var(--cream)}
.bar{height:8px;border-radius:999px;background:var(--green-2);overflow:hidden;display:flex}
.bar>i{display:block;height:8px;background:var(--gold)}
.bar>b{display:block;height:8px;background:rgba(217,200,160,.45)}
.slotline{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.slotline:first-of-type{border-top:0;padding-top:4px}
.gline{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-3);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex-shrink:0}
.kv span:last-child{text-align:right;word-break:break-all}
.pn{font-family:var(--round);font-size:21px}
.late{color:var(--danger)}
.log{font-size:12px;color:var(--muted);line-height:1.5}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.demo{position:sticky;top:0;z-index:5;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;text-align:center;padding:8px 12px}
.spin{width:28px;height:28px;border:3px solid var(--line-2);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;margin:40vh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green-ink);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(26,48,41,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--cream);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.modal-bg{align-items:center}}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:14px;background:var(--sand);margin:6px 0 12px}
.nav a,.nav button{display:flex;align-items:center;justify-content:center;min-height:42px;border:0;border-radius:10px;background:transparent;font-family:var(--round);font-size:14px;color:var(--ink-2);text-decoration:none;cursor:pointer}
.nav .on{background:var(--green);color:var(--cream)}

.cpick{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 16px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--paper);text-align:left;color:var(--green)}
.cpick .nm{font-family:var(--round);font-size:18px}.cpick .ar{margin-left:auto;color:var(--muted);font-size:14px}
.chip.end{background:var(--line-3);color:var(--muted)}.chip.live{background:var(--green);color:var(--cream)}
.citem{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:0;border-bottom:1px solid var(--line-3);background:transparent;text-align:left;color:var(--green)}
.citem.on{background:var(--sand)}.citem .nm{font-family:var(--round);font-size:16px}.citem .mt{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.cgroup{font-family:var(--round);font-size:12px;letter-spacing:.06em;color:var(--gold-d);padding:12px 14px 4px}
.clist{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:52vh;overflow-y:auto}
.tbar{display:flex;align-items:center;gap:8px}.tbar .t{flex-grow:1;height:8px;border-radius:99px;background:var(--line-3);overflow:hidden}.tbar .t i{display:block;height:100%;background:var(--gold)}
.pastsel{min-height:38px;border-radius:999px;border:1.5px dashed var(--line-2);background:var(--paper);padding:0 12px;font-family:var(--round);font-size:14px;color:var(--muted)}
.pastsel.on{background:var(--green);color:var(--cream);border:1.5px solid var(--green)}
.rp-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rp-kpi>div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.rp-kpi .v{font-family:var(--round);font-size:30px;color:var(--green);line-height:1.1}
.rp-kpi .l{font-size:12px;color:var(--ink-2)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.hb .t{height:10px;border-radius:99px;background:var(--line-3);overflow:hidden}.hb .t i{display:block;height:100%;background:var(--green)}
.hb .t i.g{background:var(--gold)}.hb .n{text-align:right;color:var(--ink-2)}
.quote{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6}
.quote small{display:block;color:var(--ink-2);font-size:12px;margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sgrid .input{height:46px;padding:0 12px}
</style>
</head>
<body>
<div id="app"><div class="spin" aria-label="불러오는 중"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="ion-store.js?v=20261031c"></script>
<script>
/* =====================================================================
   이온 신청관리 (운영진 전용 · 휴대폰용)
   - 매칭앱과 같은 운영진 계정(Firebase)으로 로그인
   - 명단은 Firebase에 실시간 저장 · 두 운영진 화면이 동시에 갱신
   - 화면을 열 때마다 미입금 자동취소 · 대기 자동배정 · 정원 재계산
   - 주소 끝에 ?demo 를 붙이면 데모 모드
   ===================================================================== */

/* ---------- 문자 문구 (자유롭게 고쳐 쓰세요) ---------- */
const TPL = {
  pay: { label: '입금 안내', for: ['pending'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, ${x.when} 신청 감사합니다 🙂

입금 계좌: ${x.account}
금액: ${x.fee}원
입금자명: ${r.payName} (꼭 이대로 적어주세요)
입금 기한: ${x.deadline}

기한까지 입금이 확인되지 않으면 자동 취소돼요.` },
  promote: { label: '자리 확보(승격)', for: ['pending'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, 기다려 주셔서 감사해요! ${x.when} 자리가 생겼어요 🙌

입금 계좌: ${x.account}
금액: ${x.fee}원
입금자명: ${r.payName}
입금 기한: ${x.deadline}

기한이 지나면 다음 대기자분께 순서가 넘어가요.` },
  confirm: { label: '참가 확정', for: ['confirmed'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, 입금 확인되어 참가가 확정되었어요 🎉

일정: ${x.when}
장소: ${x.place}
신청번호: ${r.id}

자세한 장소와 안내는 행사 전날 다시 보내드릴게요.` },
  d1: { label: 'D-1 안내', for: ['confirmed'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, 내일 뵙겠습니다 🙂

일정: ${x.when}
장소: ${x.place}

· 10분 전까지 도착해 주세요. 입구에서 번호표를 드려요.
· 마지막에 테이블 QR로 마음에 남은 분을 골라주시면 돼요.
· 늦거나 못 오시게 되면 이 번호로 꼭 연락 주세요.` },
  wait: { label: '대기 안내', for: ['waiting'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, ${x.when} 타임이 마감되어 대기 ${x.waitNo}번으로 등록되었어요.

자리가 생기면 바로 연락드릴게요. 지금은 입금하지 않으셔도 돼요.` },
  move: { label: '타임 변경 안내', for: ['pending', 'confirmed', 'waiting'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, ${r.cohort} 신청 감사합니다 🙂
더 편안한 만남을 위해 참가 타임을 ${x.from ? x.from + ' → ' : ''}${r.date} ${r.time} 으로 조정해 드렸어요.
${r.status === 'waiting' ? '지금은 대기 ' + x.waitNo + '번이고, 자리가 나면 바로 연락드릴게요.\n' : ''}일정이 어려우시면 편하게 말씀해 주세요. 감사합니다.` },
  cancel: { label: '취소 안내', for: ['cancelled', 'refunded'], make: (r, x) => `[이온 크리스천 소개팅] ${r.name}님, ${x.when} 신청이 취소되었어요.

다시 참여를 원하시면 신청 페이지에서 새로 신청해 주세요. 감사합니다.` }
};

/* ---------- 유틸 ---------- */
const $app = document.getElementById('app');
// 안내 문자 끝에 오픈채팅 문의 링크 자동 추가
['pay', 'promote', 'confirm', 'd1', 'wait', 'move'].forEach(k => { const f = TPL[k].make; TPL[k].make = (r, x) => f(r, x) + (x.chat ? `\n\n문의: 카카오톡 오픈채팅\n${x.chat}` : ''); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const won = n => Number(n || 0).toLocaleString('ko-KR');
const DEMO = IonStore.demo;
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const G = { M: '형제', F: '자매' };
const ICON = {
  out: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  msg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-5.6A8 8 0 1 1 21 12z"/></svg>',
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>'
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

  if (!n) return toast('삭제할 취소·환불 건이 없어요');

  catch (e) { toast('삭제하지 못했어요: ' + e.message); }
}

/* ---------- 공통 머리글 + 메뉴 (신청 · 매칭 · 후기 · 설정) ---------- */

function goView(v) {

/* ---------- 홈 화면 설치 안내 ---------- */
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; if (A.phase === 'main') render(); });
const STANDALONE = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function installHint() {

  return `<div class="card" style="display:flex;gap:12px;align-items:flex-start;margin:4px 0 10px;background:var(--sand);border-color:var(--gold)">

    <div class="stack" style="gap:6px;flex-grow:1"><span class="round" style="font-size:15px">홈 화면에 '이온관리' 앱으로 추가하기</span>

function viewStatus() {
  const ss = slots().filter(s => s.cohort === A.cohort); const rows = rowsOf(A.cohort);
  if (!ss.length) return '';
  return `<div class="card hero">
    <div class="between"><span class="eyebrow">${esc(A.cohort)} · ${esc(ss[0].date)} 현황</span><span class="small">확정 / 정원</span></div>
    ${ss.map(s => {
      const g = key => {
        const mine = rows.filter(r => r.slotId === s.id && r.gender === key);
        const ok = mine.filter(r => r.status === 'confirmed').length, pend = mine.filter(r => r.status === 'pending').length, wait = mine.filter(r => r.status === 'waiting').length;
        const cap = s.cap?.[key] || 0; const okW = cap ? Math.min(100, ok / cap * 100) : 0;
        return `<div class="gline"><span class="round">${G[key]}</span>
          <div class="bar" aria-hidden="true"><i style="width:${okW}%"></i><b style="width:${cap ? Math.min(100 - okW, pend / cap * 100) : 0}%"></b></div>
          <span class="small" style="color:var(--cream)"><b class="round">${ok}</b>/${cap}${pend ? ` · 입금대기 ${pend}` : ''}${wait ? ` · 대기 ${wait}` : ''}</span></div>`;
      };
      const nc = rows.filter(r => r.slotId === s.id && conflictsOf(r).length).length;
      return `<div class="slotline"><div class="between"><span class="round" style="font-size:17px">${esc(s.time)}${nc ? ` <span class="chip warn">겹침 ${nc}명</span>` : ''}${ionAgeText(s) ? ` <span class="small">${ionAgeText(s)}</span>` : ''}${s.public ? '' : ' <span class="small">(비공개)</span>'}</span>
        <button class="mini on-dark" data-act="roster" data-v="${esc(s.id)}">${ICON.copy}매칭앱 명단</button></div>${g('M')}${g('F')}</div>`;
    }).join('')}
  </div>`;
}

function repeatOf(r) {
  const d = digits(r.phone); if (!d) return '';
  const prev = apps().filter(x => x.id !== r.id && x.cohort !== r.cohort && x.status === 'confirmed' && digits(x.phone) === d && x.at < r.at).map(x => x.cohort);
  return [...new Set(prev)].join('·');
}
/* ---------- 겹침 경고: 같은 교회(이성) · 이전 만남(이성) ---------- */
const ACTIVE = ['pending', 'confirmed', 'waiting'];
const normChurch = n => String(n || '').replace(/\(.*?\)/g, '').replace(/[\s·.,\-_]/g, '').replace(/교회$/, '').replace(/^(대한예수교|기독교|예수교)/, '').toLowerCase();
const normPlace = n => String(n || '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 2).join(' ');
// 지난 매칭 명단에서 함께 있었던 기록: 전화번호 → [{sid, label}]
function metIndex() {
  if (A._met && A._metSrc === A.sessRaw) return A._met;
  const idx = {};
  Object.entries(A.sessRaw || {}).forEach(([sid, x]) => { if (!x || !x.roster) return; const lab = `${(x.pub && x.pub.cohort) || ''} ${(x.pub && x.pub.slot) || ''}`.trim();
    Object.entries(x.roster).forEach(([pid, p]) => { const d = digits(p && p.phone); if (d) (idx[d] = idx[d] || []).push({ sid, lab, g: pid[0] }); }); });
  A._met = idx; A._metSrc = A.sessRaw; return idx;
}
function metBefore(a, b, slotId) {   // 두 전화번호가 (이번 타임이 아닌) 같은 매칭 타임에 있었는지
  const idx = metIndex(); const da = digits(a.phone), db = digits(b.phone); if (!da || !db) return '';
  const sa = idx[da] || []; const hit = sa.find(x => x.sid !== 'slot-' + slotId && (idx[db] || []).some(y => y.sid === x.sid));
  if (hit) return hit.lab;
  const old = apps().find(x => x.id !== a.id && digits(x.phone) === da && x.status === 'confirmed' && x.slotId !== slotId && apps().some(y => y.slotId === x.slotId && y.status === 'confirmed' && digits(y.phone) === db));
  return old ? `${old.cohort} ${old.time}` : '';
}
function conflictsOf(r, slotId = r.slotId) {
  if (!ACTIVE.includes(r.status)) return [];
  const out = []; const mc = normChurch(r.church);
  apps().filter(x => x.id !== r.id && x.slotId === slotId && x.gender !== r.gender && ACTIVE.includes(x.status)).forEach(x => {
    if (mc && mc.length >= 2 && normChurch(x.church) === mc) {
      const pa = normPlace(r.churchAddr), pb = normPlace(x.churchAddr);
      out.push({ kind: 'church', who: x, sure: !(pa && pb && pa !== pb), text: `같은 교회${pa && pb && pa !== pb ? '(위치 다름·확인)' : ''} · ${G[x.gender]} ${x.name}` });
    }
    const met = metBefore(r, x, slotId); if (met) out.push({ kind: 'met', who: x, text: `이전 만남 · ${G[x.gender]} ${x.name} (${met})` });
  });
  return out;
}
function card(r, showCohort) {
  const st = r.status; const open = A.open[r.id]; const rep = repeatOf(r);
  const chip = { pending: 'wait', confirmed: 'ok', waiting: 'mute', cancelled: 'bad', refunded: 'bad' }[st] || 'mute';
  const late = st === 'pending' && r.deadline - Date.now() < 3 * 3600e3;
  const actions = [];
  if (st === 'pending') actions.push(`<button class="mini gold" data-act="confirm" data-v="${r.id}">${ICON.ok}입금확인</button>`);
  if (st === 'waiting') actions.push(`<button class="mini go" data-act="promote" data-v="${r.id}">자리 배정</button>`);
  const cf = conflictsOf(r);
  if (ACTIVE.includes(st) && slots().some(x => x.cohort === r.cohort && x.id !== r.slotId)) actions.push(`<button class="mini ${cf.length ? 'gold' : ''}" data-act="move" data-v="${r.id}">타임 변경</button>`);
  actions.push(`<button class="mini" data-act="msg" data-v="${r.id}">${ICON.msg}문자·카톡</button>`);
  if (['cancelled', 'refunded'].includes(st)) actions.push(`<button class="mini del" data-act="purge" data-v="${r.id}">영구삭제</button>`);
  actions.push(`<button class="mini" data-act="toggle" data-v="${r.id}" aria-expanded="${!!open}">${open ? '접기' : '상세'}</button>`);
  return `<div class="card stack" style="gap:8px">
    <div class="between"><div class="row"><span class="pn">${esc(r.payName || r.name)}</span><span class="chip ${chip}">${ION_STATUS[st] || st}${st === 'waiting' ? ' ' + waitNo(r) + '번' : ''}</span>${rep ? `<span class="chip ok" title="이전 참여 기수">재참여 · ${esc(rep)}</span>` : ''}${(() => { const sl = slots().find(x => x.id === r.slotId); return sl && !ionAgeOk(sl, r.birthYear) ? `<span class="chip bad" title="이 타임 대상 연령: ${ionAgeText(sl)}">연령 범위 밖</span>` : ''; })()}</div><span class="small">${esc(r.id)}</span></div>
    ${cf.length ? `<div class="conflict">⚠ ${cf.map(c => esc(c.text)).join('<br>⚠ ')}<br><span style="font-size:12px">같은 타임의 이성과 겹쳐요. '타임 변경'으로 다른 타임에 옮길 수 있어요.</span></div>` : ''}
    <div class="small" style="color:var(--ink-2)">${showCohort ? `<b>${esc(r.cohort)}</b> · ` : ''}${esc(r.name)} · ${G[r.gender]} · ${String(r.birthYear).slice(2)}년생 · ${esc(r.time)}</div>
    <div class="between small"><a href="tel:${digits(r.phone)}" style="color:var(--ink-2)">${esc(r.phone)}</a>
      ${st === 'pending' ? `<span class="${late ? 'late' : ''}">${esc(dt(r.deadline))} · ${esc(leftText(r.deadline))}</span>` : st === 'confirmed' ? `<span>확정 ${esc(dt(r.confirmedAt))}</span>` : `<span>신청 ${esc(dt(r.at))}</span>`}</div>
    ${r.log ? `<div class="log">✉ ${esc(r.log)}</div>` : ''}
    <div class="row" style="margin-top:2px">${actions.join('')}</div>
    ${open ? detail(r) : ''}
  </div>`;
}

function detail(r) {
  const st = r.status;
  const kv = [['출생연도', r.birthYear], ['거주지역', r.region], ['직업', r.job], ['출석교회', r.church], ['교회 위치', r.churchAddr], ['교단', r.denom],
    ['신앙생활', r.faithYears], ['출석', r.attend], ['알게 된 경로', r.source], ['소식 수신', r.newsAgree], ['신청일시', dt(r.at, true)], ['요청사항', r.note]]
    .filter(x => x[1] !== '' && x[1] != null);
  const more = [];
  if (['pending', 'confirmed', 'waiting'].includes(st)) more.push(`<button class="mini del" data-act="cancel" data-v="${r.id}">취소 처리</button>`);
  if (st === 'confirmed') more.push(`<button class="mini del" data-act="refund" data-v="${r.id}">환불 처리</button>`, `<button class="mini" data-act="restore" data-v="${r.id}">확정 취소(입금대기로)</button>`);
  if (['cancelled', 'refunded'].includes(st)) more.push(`<button class="mini" data-act="restore" data-v="${r.id}">입금대기로 되돌리기</button>`, `<button class="mini del" data-act="purge" data-v="${r.id}">영구삭제</button>`);
  return `<div style="border-top:1px solid var(--line-3);margin-top:6px;padding-top:6px">
    ${kv.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
    <div class="field" style="margin-top:10px"><label for="m-${r.id}">운영진 메모</label>
      <textarea id="m-${r.id}" class="input" style="min-height:70px" data-memo="${r.id}">${esc(r.memo)}</textarea></div>
    <div class="row" style="margin-top:8px"><button class="mini go" data-act="memo" data-v="${r.id}">메모 저장</button>${more.join('')}</div>
  </div>`;
}

/* ---------- 후기 ---------- */
const REV_URL = (c, t) => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}review.html?c=${encodeURIComponent(c)}&t=${encodeURIComponent(t)}`;
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
function reviewList() { return Object.values(A.reviews || {}).sort((a, b) => b.at - a.at); }
function cohortTimes(c) { const ts = slots().filter(x => x.cohort === c).map(x => x.time); ((A.sessT || {})[c] || []).forEach(t => { if (!ts.includes(t)) ts.push(t); }); return ts.sort(); }
function reviewLinkCard() {
  const cs = A.rCohort ? [A.rCohort] : cohortIndex().live.map(c => c.name);
  const rows = cs.flatMap(c => cohortTimes(c).map(t => ({ c, t })));

  return `<div class="card stack" style="gap:10px;margin-top:12px">
    <div class="between"><span class="round" style="font-size:16px">후기 받기 · 링크와 QR</span><span class="small">${A.rCohort ? '' : '진행 중 기수'}</span></div>

function viewRReport() {
  const rs = reviewList().filter(r => !A.rCohort || r.cohort === A.rCohort); const n = rs.length;
  const pc = (a, b) => b ? Math.round(a / b * 100) : 0;
  const avg = n ? rs.reduce((t, r) => t + (+r.sat || 0), 0) / n : 0;

  const yesAgain = ((RFORM().q.find(x => x.id === 'again') || {}).options || [])[0] || '';

  const bars = (pairs, total, gold) => pairs.map(([k, v]) => `<div class="hb"><span>${esc(k)}</span><span class="t"><i class="${gold ? 'g' : ''}" style="width:${pc(v, total)}%"></i></span><span class="n">${v}</span></div>`).join('');
  const tally = k => { const m = {}; rs.forEach(r => { const v = r[k]; if (v !== undefined && v !== '') m[v] = (m[v] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };

  // 타임별 비교
  const groups = {}; rs.forEach(r => { const k = `${r.cohort} · ${r.time}`; (groups[k] = groups[k] || []).push(r); });
  const byTime = Object.entries(groups).map(([k, xs]) => [k, xs.length, xs.reduce((t, r) => t + (+r.sat || 0), 0) / xs.length]);
  // 좋았던 말 (만족도 높은 순, 홍보 동의 먼저) · 바라는 점 (없음 제외)
  const none = v => !String(v || '').trim() || /^(없음|없어요|없습니다|x|-|\.)$/i.test(String(v).trim());
  const uniq = (xs, k) => { const seen = new Set(); return xs.filter(r => { const t = String(r[k]).trim(); if (seen.has(t)) return false; seen.add(t); return true; }); };
  const good = uniq(rs.filter(r => !none(r.felt)).sort((a, b) => (b.share ? 1 : 0) - (a.share ? 1 : 0) || b.sat - a.sat), 'felt').slice(0, 6);
  const wants = uniq(rs.filter(r => !none(r.improve)), 'improve');
  const moments = uniq(rs.filter(r => !none(r.moment)), 'moment').slice(0, 6);
  // 자주 나온 말 (2글자 이상 명사 비슷한 단어)
  const STOP = new Set('없음 없어요 그리고 그래서 그런데 너무 정말 진짜 조금 좀 더 많이 있어요 없어요 같아요 했어요 좋았어요 있었어요 생각 오늘 이번 다음 저는 제가 분들 분이 시간이 시간'.split(' '));
  const freq = {}; rs.forEach(r => [r.felt, r.moment, r.improve].join(' ').replace(/[^가-힣a-zA-Z\s]/g, ' ').split(/\s+/).map(w => w.replace(/(은|는|이|가|을|를|에|에서|도|와|과|으로|로|의|요)$/, '')).filter(w => w.length >= 2 && !STOP.has(w)).forEach(w => { freq[w] = (freq[w] || 0) + 1; }));
  const words = Object.entries(freq).filter(([, v]) => v >= 2).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const extras = RFORM().q.filter(x => !x.core && x.type === 'choice').map(q => { const m = {}; rs.forEach(r => { const v = (r.extra || {})[q.id]; if (v) m[v] = (m[v] || 0) + 1; }); return [q.label, Object.entries(m).sort((a, b) => b[1] - a[1])]; }).filter(([, e]) => e.length);
  return `<div class="wrap">
    ${appHead('reviews')}
    <div class="between" style="margin:6px 0 10px"><span class="h2" style="font-size:20px">후기 한눈에 보기 · ${A.rCohort ? esc(A.rCohort) : '전체'}</span><button class="mini" data-act="rreport-back">← 후기로</button></div>
    ${!n ? '<div class="card empty">아직 후기가 없어요</div>' : `<div class="stack" style="gap:12px">
      <div class="rp-kpi">
        <div><div class="v">${n}<span class="small"> 명</span></div><div class="l">응답 수</div></div>
        <div><div class="v">${avg.toFixed(1)}<span class="small"> / 5</span></div><div class="l">평균 만족도 ${'★'.repeat(Math.round(avg))}</div></div>
        <div><div class="v">${pc(again, n)}<span class="small">%</span></div><div class="l">다음에도 참여하고 싶어요</div></div>
        <div><div class="v">${npsN.length ? pc(pro, npsN.length) - pc(det, npsN.length) : '-'}</div><div class="l">추천 지수(NPS) · 추천 ${pro} · 비추천 ${det}</div></div>
      </div>
      ${sec('만족도 분포', bars([5, 4, 3, 2, 1].map(k => ['★'.repeat(k), rs.filter(r => +r.sat === k).length]), n, true))}
      ${byTime.length > 1 ? sec('타임별 비교', byTime.map(([k, c, a]) => `<div class="hb"><span>${esc(k)} <span class="small">${c}명</span></span><span class="t"><i class="g" style="width:${a / 5 * 100}%"></i></span><span class="n">${a.toFixed(1)}</span></div>`).join(''), '평균 만족도') : ''}
      ${sec('참가 전 걱정', bars(tally('worry'), n))}
      ${sec('소규모 진행', bars(tally('size'), n))}
      ${sec('대화 시간', bars(tally('pace'), n))}
      ${sec('재참여 의향', bars(tally('again'), n))}
      ${extras.map(([l, e]) => sec(esc(l), bars(e, n))).join('')}
      ${words.length ? sec('자주 나온 말', `<div class="chips" style="flex-wrap:wrap">${words.map(([w, c]) => `<span class="chip mute" style="font-size:${12 + Math.min(6, c)}px">${esc(w)} ${c}</span>`).join('')}</div>`, '소감·기억에 남는 순간·바라는 점에서 2번 이상 나온 말') : ''}
      ${sec('좋았다는 이야기', good.map(r => `<div class="quote">"${esc(r.felt)}"<small>${'★'.repeat(r.sat)} · ${esc(r.cohort)} ${esc(r.time)}${r.share ? ` · 홍보 동의(${esc(r.label)})` : ''}</small></div>`).join(''))}
      ${sec('기억에 남는 순간', moments.map(r => `<div class="quote">${esc(r.moment)}<small>${esc(r.cohort)} ${esc(r.time)}</small></div>`).join(''))}
      ${sec(`바라는 점 · ${wants.length}건`, wants.map(r => `<div class="quote">${esc(r.improve)}<small>${'★'.repeat(r.sat)} · ${esc(r.cohort)} ${esc(r.time)}</small></div>`).join(''), '다음 기수 준비할 때 체크리스트로 쓰세요')}

    <div class="spacer" style="min-height:20px"></div></div>`;
}

/* ---------- 신청관리 타임 → 매칭 타임 자동 연동 ---------- */
// 신청관리의 타임(apply/slots/{id})마다 매칭 타임(sessions/slot-{id})을 하나씩 자동으로 만들고,
// 투표 시작 전이면 기수·날짜·시간 변경도 따라 바꿔요. 투표가 시작된 타임은 건드리지 않아요.
function slotIsoDate(txt) {
  const m = String(txt || '').match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})/);

  if (!m) return now.toISOString().slice(0, 10);

  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function sessionSyncUpdates(slots, sessions, removedSlotIds) {
  const up = {};

    const pub = { cohort: s.cohort, date: slotIsoDate(s.date), slot: s.time };
    if (!cur || !cur.pub) up[sid + '/pub'] = { ...pub, status: 'ready', M: 0, F: 0, createdAt: Date.now(), applySlot: id };
    else if (cur.pub.status === 'ready') {
      ['cohort', 'date', 'slot'].forEach(k => { if (cur.pub[k] !== pub[k]) up[`${sid}/pub/${k}`] = pub[k]; });
      if (cur.pub.applySlot !== id) up[`${sid}/pub/applySlot`] = id;
    }
  });
  (removedSlotIds || []).forEach(id => {   // 삭제된 타임: 아직 명단·투표가 없을 때만 함께 삭제
    const cur = (sessions || {})['slot-' + id];

}

    if (Object.keys(up).length) await IonStore.update('sessions', up);
