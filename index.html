<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26453B">
<title>이온 시그널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ===== 이온 디자인 토큰 (카드뉴스·표지와 동일 톤) ===== */
:root{
  --green:#26453B; --green-2:#3A5C50; --green-ink:#1A3029;
  --cream:#F6F1E7; --paper:#FFFDF8; --sand:#EFE7D6;
  --line:#E9E1CF; --line-2:#E4DCCB; --line-3:#F0EADC;
  --gold:#D9C8A0; --gold-d:#B08A3E; --gold-t:#7A5C22; --gold-soft:#EAD9A8; --gold-ink:#5A431A;
  --muted:#5C6B63; --ink-2:#3F5249; --mint:#E3EAE6; --sub:#C9D6CF;
  --danger:#9B3B2A;
  --round:'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body:'Gowun Dodum', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--green);font-family:var(--body);-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:20px 22px calc(28px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:600px}
.dark{background:var(--green);color:var(--cream)}
.round{font-family:var(--round);font-weight:400}
.brand{font-family:var(--round);font-size:20px;letter-spacing:.12em}
.eyebrow{font-family:var(--round);font-size:13px;letter-spacing:.1em;color:var(--gold-t)}
.dark .eyebrow{color:var(--gold)}
.h1{font-family:var(--round);font-weight:400;font-size:30px;line-height:1.38;margin:0}
.h2{font-family:var(--round);font-weight:400;font-size:22px;line-height:1.4;margin:0}
.p{margin:0;font-size:15px;line-height:1.7;color:var(--muted)}
.dark .p{color:var(--sub)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.dark .small,.card.hero .small{color:var(--sub)}
.card.hero .eyebrow{color:var(--gold)}
.spacer{flex-grow:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:12px;margin-left:-10px;color:inherit}
.pill{padding:6px 14px;border:1px solid var(--gold);border-radius:999px;font-size:12px;color:var(--gold);letter-spacing:.04em}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:var(--cream);font-family:var(--round);font-size:17px;text-decoration:none;padding:0 18px}
.btn:disabled{background:var(--line-2);color:var(--muted);cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.line{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn.soft{background:var(--sand);color:var(--green)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto}
.btn.danger{background:transparent;border:2px solid var(--danger);color:var(--danger)}
.btn:active{transform:translateY(1px)}

/* 입력 */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--ink-2)}
.dark .field label{color:#E4E9E5}
.input{height:54px;padding:0 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--paper);color:var(--green);width:100%}
.dark .input{border:0}
textarea.input{height:auto;min-height:130px;padding:14px 16px;line-height:1.6;resize:vertical}
select.input{appearance:none;-webkit-appearance:none}
.input:focus{outline:3px solid var(--gold);outline-offset:1px}
.err{color:#F3C6BC;font-size:14px;min-height:20px}
.err.on-cream{color:var(--danger)}

/* 카드 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}
.card.hero{background:var(--green);color:var(--cream);border:0}
.card.r1{border:2px solid var(--green);box-shadow:0 10px 30px rgba(38,69,59,.10)}
.card.r2{border:2px solid var(--gold-d)}
.card.void{border:2px dashed #D8CFBC}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-family:var(--round);font-size:12px;white-space:nowrap}
.chip.r1{background:var(--green);color:var(--cream)}
.chip.r2{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:var(--mint);color:var(--green)}
.chip.wait{background:var(--gold-soft);color:var(--gold-ink)}
.chip.mute{background:var(--sand);color:var(--ink-2)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 14px 8px 18px;border-bottom:1px solid var(--line-3)}
.li:last-child{border-bottom:0}
.li .no{font-family:var(--round);width:68px;flex-shrink:0}
.li .meta{flex-grow:1;min-width:0;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{min-height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--sand);color:var(--green);font-family:var(--round);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mini.done{background:var(--mint)}
.mini.del{background:transparent;color:var(--danger)}

/* 순위 선택 카드 */
.slot{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--paper);border:1px solid var(--line-2)}
.slot.one{background:var(--green);color:var(--cream);border:0}
.slot .k{font-family:var(--round);font-size:12px;color:var(--gold-t)}
.slot.one .k{color:var(--gold)}
.slot .v{font-family:var(--round);font-size:21px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:16px;border-radius:18px;background:var(--paper);border:2px solid var(--line);text-align:left;color:var(--green)}
.pick .who{font-size:13px;color:var(--muted)}
.pick .num{font-family:var(--round);font-size:34px;line-height:1}
.pick.on1{border-color:var(--green);box-shadow:0 8px 20px rgba(38,69,59,.12)}
.pick.on2{border-color:var(--gold-d)}
.notice{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sand);font-size:13px;line-height:1.55;color:var(--ink-2)}

/* 티켓 */
.ticket{background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(38,69,59,.10);text-align:left}
.ticket .perf{display:flex;align-items:center}
.ticket .notch{width:14px;height:28px;background:var(--cream);border:2px solid var(--line)}
.ticket .notch.l{margin-left:-2px;border-radius:0 14px 14px 0;border-left:0}
.ticket .notch.r{margin-right:-2px;border-radius:14px 0 0 14px;border-right:0}
.ticket .dash{flex-grow:1;border-top:2px dashed var(--line-2)}
.ticket .tr{display:flex;justify-content:space-between;align-items:center;padding:14px 22px}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:14px;background:var(--sand)}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-family:var(--round);font-size:14px;color:var(--ink-2)}
.tab.on{background:var(--green);color:var(--cream)}
.bar{height:8px;border-radius:999px;background:var(--green-2);overflow:hidden}
.bar>i{display:block;height:8px;border-radius:999px;background:var(--gold)}
.section-t{font-family:var(--round);font-size:13px;letter-spacing:.06em;color:var(--gold-t);margin:8px 0 -2px}
.pair{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--round);font-size:20px;text-align:center;flex-wrap:wrap}
.pair small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}
.demo{position:sticky;top:0;z-index:5;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;text-align:center;padding:8px 12px}
.qrbox{display:flex;justify-content:center;padding:18px;background:var(--paper);border-radius:20px;border:1px solid var(--line)}
.qrbox canvas,.qrbox img{display:block}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.center{text-align:center}
.check{display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:999px;background:var(--green);margin:0 auto}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--line-2);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;margin:40vh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}

/* 토스트 · 모달 */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green-ink);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(26,48,41,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal{width:100%;max-width:440px;background:var(--cream);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.modal-bg{align-items:center}}
@media print{.noprint{display:none!important} body{background:#fff}}
</style>
</head>
<body>
<div id="app"><div class="spin" aria-label="불러오는 중"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<!-- Firebase (compat) · QR 코드 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* =====================================================================
   이온 시그널 — 로테이션 소개팅 매칭 앱 (단일 HTML)
   ---------------------------------------------------------------------
   ▶ 설정: 아래 FIREBASE_CONFIG 에 Firebase 웹앱 설정값을 붙여넣으세요.
     비워두면 '데모 모드'(이 브라우저에만 저장)로 동작합니다.
   ▶ 주소
     - 참가자:  index.html?s=<타임ID>   (관리자 화면의 QR로 배포)
     - 관리자:  index.html#admin
   ▶ 매칭 규칙
     - 1순위끼리 서로 지목 → 1순위 매칭
     - 2순위끼리 서로 지목 → 2순위 매칭
     - 1순위 성사자의 2순위 매칭은 자동 무효
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDHz9ER8j0rUNFc1wTlIrLorRdKcOU8M6M",
  authDomain: "eon-signal.firebaseapp.com",
  databaseURL: "https://eon-signal-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "eon-signal",
  appId: "1:723279688370:web:63dadb45e52e117e8ecfab"
};

/* ---------- 공통 유틸 ---------- */
const $app = document.getElementById('app');
const GENDER = { M: '형제', F: '자매' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const label = id => id ? `${GENDER[id[0]]} ${id.slice(1)}번` : '';
const opposite = g => (g === 'M' ? 'F' : 'M');
const digits = s => String(s || '').replace(/\D/g, '');
const fmtPhone = p => { const d = digits(p); return d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : d; };
const sortIds = (a, b) => a[0] === b[0] ? (+a.slice(1)) - (+b.slice(1)) : (a[0] === 'M' ? -1 : 1);
const STATUS = { ready: '시작 전', open: '투표 중', closed: '마감' };
const ICON = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  lock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
  check: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D9C8A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  heart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B08A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  bell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26453B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>'
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function confirmBox(title, body, okText = '확인', danger = false) {
  return new Promise(resolve => {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <p class="h2">${esc(title)}</p>${body ? `<p class="p">${esc(body)}</p>` : ''}
      <div class="grid2"><button class="btn soft" data-r="0">취소</button><button class="btn ${danger ? 'danger' : ''}" data-r="1">${esc(okText)}</button></div>
    </div></div>`;
    m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { m.innerHTML = ''; resolve(b.dataset.r === '1'); });
    m.querySelector('[data-r="1"]').focus();
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* 이름+번호 뒷자리 → 본인 확인 키 (명단을 참가자에게 보내지 않기 위한 해시) */
async function makeKey(sid, name, last4) {
  const text = `${sid}|${String(name).replace(/\s+/g, '').toLowerCase()}|${digits(last4).slice(-4)}`;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193; // 예비: FNV 변형
  for (let i = 0; i < text.length; i++) { h1 = Math.imul(h1 ^ text.charCodeAt(i), 16777619); h2 = Math.imul(h2 + text.charCodeAt(i), 2246822519); }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}

/* ---------- 매칭 판정 ---------- */
function computeMatches(roster, votes) {
  roster = roster || {}; votes = votes || {};
  const ids = Object.keys(roster).sort(sortIds);
  const f = id => (votes[id] && votes[id].first) || null;
  const s = id => (votes[id] && votes[id].second) || null;
  const first = [], second = [], voided = [];
  const matched = {};
  for (const a of ids) {
    const b = f(a);
    if (b && a < b && roster[b] && f(b) === a) { first.push([a, b]); matched[a] = { partner: b, rank: 1 }; matched[b] = { partner: a, rank: 1 }; }
  }
  const firstSet = new Set(Object.keys(matched));
  for (const a of ids) {
    const b = s(a);
    if (b && a < b && roster[b] && s(b) === a) {
      if (firstSet.has(a) || firstSet.has(b)) {
        const who = firstSet.has(a) && firstSet.has(b) ? [a, b] : [firstSet.has(a) ? a : b];
        voided.push({ pair: [a, b], who });
      } else { second.push([a, b]); matched[a] = { partner: b, rank: 2 }; matched[b] = { partner: a, rank: 2 }; }
    }
  }
  const orderPair = p => p.slice().sort(sortIds);
  return {
    first: first.map(orderPair), second: second.map(orderPair),
    voided: voided.map(v => ({ ...v, pair: orderPair(v.pair) })),
    matched, misses: ids.filter(id => !matched[id])
  };
}

/* ---------- 카톡 안내 문구 ---------- */
function msgMatch(me, partner, rank, pub) {
  return `안녕하세요 ${me.name}님, 이온 로테이션 소개팅입니다 😊
${pub.cohort} ${pub.slot} 타임에 함께해 주셔서 감사해요.

기쁜 소식 전해드려요!
${label(partner.id)} ${partner.name}님과 서로 ${rank}순위로 마음이 닿았어요.

📞 연락처: ${fmtPhone(partner.phone)}

먼저 가볍게 인사 건네보시길 바라요.
좋은 인연 되시길 응원합니다 🙏`;
}
function msgMiss(me, pub) {
  return `안녕하세요 ${me.name}님, 이온 로테이션 소개팅입니다.
${pub.cohort} ${pub.slot} 타임에 귀한 시간 내주셔서 감사합니다.

아쉽게도 이번 타임에는 같은 순위로 서로 이어진 분이 없었어요.
다음 기수 소식도 전해드릴게요. 좋은 만남 계속 응원하겠습니다 🙏`;
}

/* =====================================================================
   데이터 계층 — Firebase Realtime Database 또는 데모(로컬) 저장소
   ===================================================================== */
const USE_FB = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && window.firebase);
let DB, AUTH;

function makeLocalDB() {
  const KEY = 'eon-signal-demo-db';
  const load = () => lsGet(KEY) || {};
  let tree = load();
  const subs = [];
  const parts = p => String(p).split('/').filter(Boolean);
  const clone = v => (v === undefined ? null : JSON.parse(JSON.stringify(v)));
  function getAt(p) { let n = tree; for (const k of parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : clone(n); }
  function setAt(p, v) {
    const ks = parts(p);
    if (!ks.length) { tree = v || {}; return; }
    let n = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof n[ks[i]] !== 'object' || n[ks[i]] === null) n[ks[i]] = {}; n = n[ks[i]]; }
    if (v === null || v === undefined) delete n[ks[ks.length - 1]]; else n[ks[ks.length - 1]] = clone(v);
  }
  function notify() { for (const l of subs) { const v = getAt(l.path); const s = JSON.stringify(v); if (s !== l.last) { l.last = s; l.cb(v); } } }
  function save() { lsSet(KEY, tree); notify(); }
  window.addEventListener('storage', e => { if (e.key === KEY) { tree = load(); notify(); } });
  return {
    async get(p) { return getAt(p); },
    async set(p, v) { setAt(p, v); save(); },
    async update(p, obj) { for (const [k, v] of Object.entries(obj)) setAt(p + '/' + k, v); save(); },
    async remove(p) { setAt(p, null); save(); },
    watch(p, cb) { const l = { path: p, cb, last: JSON.stringify(getAt(p)) }; subs.push(l); setTimeout(() => cb(getAt(p)), 0); return () => { const i = subs.indexOf(l); if (i >= 0) subs.splice(i, 1); }; },
    newId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
    reset() { tree = {}; save(); }
  };
}
function makeFirebaseDB(db) {
  return {
    async get(p) { const s = await db.ref(p).get(); return s.exists() ? s.val() : null; },
    set: (p, v) => db.ref(p).set(v),
    update: (p, o) => db.ref(p).update(o),
    remove: p => db.ref(p).remove(),
    watch(p, cb, onErr) { const r = db.ref(p); const h = s => cb(s.val()); r.on('value', h, e => { console.error(e); onErr && onErr(e); }); return () => r.off('value', h); },
    newId() { return db.ref('sessions').push().key; }
  };
}
function makeLocalAuth() {
  const subs = []; const K = 'eon-signal-demo-admin';
  const state = () => ({ user: { uid: 'demo' }, admin: lsGet(K) === true });
  return {
    async ensureAnon() {},
    async signIn() { lsSet(K, true); subs.forEach(cb => cb(state())); },
    async signOut() { lsSet(K, false); subs.forEach(cb => cb(state())); },
    onChange(cb) { subs.push(cb); setTimeout(() => cb(state()), 0); }
  };
}
function makeFirebaseAuth(auth) {
  return {
    async ensureAnon() { if (!auth.currentUser) await auth.signInAnonymously(); },
    signIn: (e, p) => auth.signInWithEmailAndPassword(e, p),
    signOut: () => auth.signOut(),
    onChange(cb) {
      auth.onAuthStateChanged(async u => {
        if (!u || u.isAnonymous) return cb({ user: u, admin: false });
        let ok = false; try { ok = (await DB.get('admins/' + u.uid)) === true; } catch (e) {}
        cb({ user: u, admin: ok });
      });
    }
  };
}
function initStore() {
  if (USE_FB) {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    DB = makeFirebaseDB(app.database());
    AUTH = makeFirebaseAuth(app.auth());
  } else { DB = makeLocalDB(); AUTH = makeLocalAuth(); }
}
const demoBanner = () => USE_FB ? '' : `<div class="demo noprint">데모 모드 · 이 브라우저에만 저장돼요</div>`;

const P = { sid: null, phase: 'loading', pub: null, me: null, first: null, second: null, err: '', busy: false, unsub: null };

function startParticipant(sid) {
  P.sid = sid;
  if (!sid) { P.phase = 'nosession'; return renderP(); }
  const done = lsGet('eon-signal-done-' + sid);
  if (done) { P.me = done.me; P.first = done.first; P.second = done.second; P.phase = 'done'; }
  const saved = !done && JSON.parse(sessionStorage.getItem('eon-signal-me-' + sid) || 'null');
  if (saved) { P.me = saved; }
  AUTH.ensureAnon().then(() => {
    P.unsub = DB.watch(`sessions/${sid}/pub`, pub => {
      P.pub = pub;
      if (!pub) { P.phase = 'nosession'; }
      else if (P.phase !== 'done') { P.phase = P.me ? 'pick' : 'entry'; }
      renderP();
    }, () => { P.phase = 'error'; P.err = '정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'; renderP(); });
  }).catch(e => { console.error(e); P.phase = 'error'; P.err = '접속에 실패했어요. 운영진에게 말씀해 주세요.'; renderP(); });
}

function renderP() {
  const pub = P.pub || {};
  const tag = pub.cohort ? `${esc(pub.cohort)} · ${esc(pub.slot)}` : '';
  let html = '';
  if (P.phase === 'loading') html = `<div class="spin" aria-label="불러오는 중"></div>`;
  else if (P.phase === 'nosession' || P.phase === 'error') {
    html = `<div class="wrap dark"><div class="top"><span class="brand">ION</span></div>
      <div class="spacer"></div>
      <div class="stack center"><p class="h1">${P.phase === 'error' ? '잠시 문제가 생겼어요' : '테이블의 QR로<br>들어와 주세요'}</p>
      <p class="p">${P.phase === 'error' ? esc(P.err) : '현장에 있는 QR 코드를 찍으면 오늘 타임으로 바로 연결돼요.'}</p></div>
      <div class="spacer"></div></div>`;
  }
  else if (P.phase === 'done') html = viewDone(tag);
  else if (pub.status === 'closed') {
    html = `<div class="wrap dark"><div class="top"><span class="brand">ION</span><span class="pill">${tag}</span></div>
      <div class="spacer"></div><div class="stack center"><p class="h1">투표가 마감됐어요</p>
      <p class="p">결과는 오늘 중으로 카카오톡으로 안내드릴게요.<br>함께해 주셔서 감사합니다.</p></div><div class="spacer"></div></div>`;
  }
  else if (P.phase === 'entry') html = viewEntry(tag);
  else if (P.phase === 'pick') html = pub.status === 'open' ? viewPick(tag) : viewWaiting(tag);
  $app.innerHTML = demoBanner() + html;
  if (P.phase === 'entry') { const n = document.getElementById('nm'); if (n && !n.value && !('ontouchstart' in window)) n.focus(); }
}

function viewWaiting(tag) {

    <div class="stack center"><span class="eyebrow">${esc(P.me.name)}님 · ${label(P.me.id)}</span>

    <a class="btn gold" href="review.html?c=${encodeURIComponent((P.pub && P.pub.cohort) || '')}&t=${encodeURIComponent((P.pub && P.pub.slot) || '')}">오늘 소개팅 후기 남기기 (2분)</a>

async function onEntry(form) {
  const name = form.querySelector('#nm').value.trim();
  const last4 = digits(form.querySelector('#ph').value);
  const errEl = document.getElementById('entry-err');
  if (!name || last4.length !== 4) { errEl.textContent = '이름과 휴대폰 번호 뒷 4자리를 입력해 주세요.'; return; }
  P.busy = true; P.err = ''; renderP();
  try {
    const key = await makeKey(P.sid, name, last4);
    const hit = await DB.get(`sessions/${P.sid}/keys/${key}`);
    if (!hit || !hit.id) { P.err = '명단에서 찾지 못했어요. 신청서의 이름과 번호를 확인해 주세요.'; }
    else {
      P.me = { id: hit.id, name, key };
      sessionStorage.setItem('eon-signal-me-' + P.sid, JSON.stringify(P.me));
      P.first = null; P.second = null; P.phase = 'pick';
    }
  } catch (e) { console.error(e); P.err = '확인 중 문제가 생겼어요. 다시 시도해 주세요.'; }
  P.busy = false; renderP();
  if (P.err) { const n = document.getElementById('nm'), p = document.getElementById('ph'); if (n) n.value = name; if (p) p.value = last4; }
}

function onPick(id) {
  if (P.first === id) { P.first = P.second; P.second = null; }
  else if (P.second === id) { P.second = null; }
  else if (!P.first) { P.first = id; }
  else { P.second = id; }
  renderP();
}

async function onSubmit() {
  const body = `1순위: ${label(P.first)}\n2순위: ${P.second ? label(P.second) : '선택 안 함'}`;
  if (!(await confirmBox('이대로 제출할까요?', body + '\n제출 후에는 수정할 수 없어요.', '제출하기'))) return;
  P.busy = true; renderP();
  const path = `sessions/${P.sid}/votes/${P.me.id}`;
  const vote = { first: P.first, second: P.second || '', key: P.me.key, at: Date.now() };
  try {
    if (!USE_FB) { // 데모: 규칙 흉내
      const pub = await DB.get(`sessions/${P.sid}/pub`);
      if (!pub || pub.status !== 'open') throw new Error('closed');
      if (await DB.get(path)) throw new Error('exists');
    }
    await DB.set(path, vote);
    lsSet('eon-signal-done-' + P.sid, { me: { id: P.me.id, name: P.me.name }, first: P.first, second: P.second });
    sessionStorage.removeItem('eon-signal-me-' + P.sid);
    P.phase = 'done';
  } catch (e) {
    console.error(e);
    let pub = null; try { pub = await DB.get(`sessions/${P.sid}/pub`); } catch (_) {}
    toast(pub && pub.status !== 'open' ? '투표가 마감되어 제출할 수 없어요.' : '이미 제출된 기록이 있어요. 운영진에게 말씀해 주세요.');
  }
  P.busy = false; renderP();
}

const A = { authed: false, checked: false, view: 'home', sid: null, tab: 'people', sessions: {}, cur: null, unsubList: null, unsubCur: null, loginErr: '', busy: false };

function startAdmin() {
  AUTH.onChange(st => {
    A.checked = true; A.authed = !!st.admin;
    A.notAdmin = !!(st.user && !st.user.isAnonymous && !st.admin && USE_FB);
    if (A.authed && !A.unsubList) A.unsubList = DB.watch('sessions', v => { A.sessions = v || {}; renderA(); }, () => toast('목록을 불러오지 못했어요'));

    renderA();
  });

/* 다시 그릴 때 입력 중인 값 지키기 */
function keepInputs(fn) {
  const kept = {}; const act = document.activeElement;
  document.querySelectorAll('[data-keep]').forEach(el => { kept[el.id] = el.value; });
  const focusId = act && act.id; const sel = act && act.selectionStart;
  fn();
  Object.entries(kept).forEach(([id, v]) => { const el = document.getElementById(id); if (el && v) el.value = v; });
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (_) {} } }
}

function renderA() {
  keepInputs(() => {
    let html;
    if (!A.checked) html = `<div class="spin" aria-label="불러오는 중"></div>`;
    else if (!A.authed) html = viewLogin();
    else if (A.view === 'session' && A.sid) html = viewSession();

function sessionStats(s) {
  const pub = s.pub || {}; const roster = s.roster || {};

}

  return `<div class="wrap wide">
    <div class="between" style="min-height:44px"><div class="stack" style="gap:2px"><span class="eyebrow" style="font-size:12px">ION 관리자</span><span class="h2">기수 · 타임 관리</span></div>

    <div class="stack" style="margin-top:16px;gap:12px">${items || '<div class="card empty">아직 만든 타임이 없어요. 아래에서 첫 타임을 만들어 보세요.</div>'}</div>
    <span class="section-t" style="margin-top:22px">새 타임 만들기</span>
    <form class="card stack" style="margin-top:12px" data-form="new-session">
      <div class="field"><label for="ns-cohort">기수 이름</label><input id="ns-cohort" data-keep class="input" placeholder="예: 크리스천 3기" required maxlength="30"></div>

/* 명단 전체를 다시 써서 번호·본인확인 키·인원수를 항상 맞춤 */
async function writeRoster(list) {
  const roster = {}, keys = {}, cnt = { M: 0, F: 0 };
  for (const g of ['M', 'F']) {
    for (const p of list.filter(x => x.gender === g)) {
      cnt[g]++; const id = g + cnt[g];
      roster[id] = { gender: g, no: cnt[g], name: p.name, phone: digits(p.phone) };
      const k = await makeKey(A.sid, p.name, digits(p.phone).slice(-4));
      if (keys[k]) throw new Error(`이름과 번호 뒷자리가 같은 분이 있어요: ${p.name}`);
      keys[k] = { id };
    }
  }
  await DB.update(`sessions/${A.sid}`, { roster, keys, 'pub/M': cnt.M, 'pub/F': cnt.F });
}
function parseGender(t) {
  const s = String(t).trim().toLowerCase();
  if (['남', '남자', '남성', '형제', 'm', 'male'].includes(s)) return 'M';
  if (['여', '여자', '여성', '자매', 'f', 'female'].includes(s)) return 'F';
  return null;
}
function parseBulk(text) {
  const out = [], bad = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const toks = line.split(/[\t,]+|\s{2,}/).map(t => t.trim()).filter(Boolean);
    const parts = toks.length >= 3 ? toks : line.split(/\s+/);
    let g = null, phone = null; const rest = [];
    parts.forEach(t => { const pg = parseGender(t); if (!g && pg) g = pg; else if (!phone && digits(t).length >= 9) phone = digits(t); else rest.push(t); });
    const name = rest.join(' ').trim();
    if (g && phone && name) out.push({ gender: g, name, phone }); else bad.push(line);
  });
  return { out, bad };
}
async function setStatus(to) {
  const msgs = { open: ['투표를 시작할까요?', '참가자 화면에서 번호를 고를 수 있게 돼요.'], closed: ['투표를 마감할까요?', '마감 후에는 참가자가 제출할 수 없어요.'] };
  const [t, b] = msgs[to] || ['상태를 바꿀까요?', ''];
  if (!(await confirmBox(t, b, to === 'closed' ? '마감하기' : '시작하기'))) return;
  await DB.update(`sessions/${A.sid}/pub`, { status: to });
  if (to === 'closed') { A.tab = 'result'; renderA(); }
  toast(to === 'closed' ? '마감했어요. 결과를 확인해 주세요.' : '투표를 열었어요.');
}
function exportCSV() {
  const s = A.cur; const roster = s.roster || {}; const votes = s.votes || {}; const sent = s.sent || {};
  const R = computeMatches(roster, votes);
  const rows = [['번호', '이름', '연락처', '1순위', '2순위', '결과', '상대 번호', '상대 이름', '상대 연락처', '안내 발송']];
  Object.keys(roster).sort(sortIds).forEach(id => {
    const p = roster[id]; const v = votes[id] || {}; const m = R.matched[id]; const q = m ? roster[m.partner] : null;
    rows.push([label(id), p.name, fmtPhone(p.phone), label(v.first), label(v.second), m ? `${m.rank}순위 매칭` : (v.first ? '불성사' : '미제출'), m ? label(m.partner) : '', q ? q.name : '', q ? fmtPhone(q.phone) : '', sent[id] ? 'O' : '']);
  });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `이온시그널_${s.pub.cohort}_${s.pub.slot}_${s.pub.date}.csv`.replace(/\s+/g, '');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function seedDemo() {

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  try {
    if (kind === 'entry') return onEntry(f);
    if (kind === 'login') {
      A.busy = true; A.loginErr = ''; renderA();
      try { await AUTH.signIn(f.querySelector('#em').value.trim(), f.querySelector('#pw').value); }
      catch (err) { A.loginErr = '이메일 또는 비밀번호를 확인해 주세요.'; }
      A.busy = false; renderA(); return;
    }
    if (kind === 'new-session') {
      const cohort = f.querySelector('#ns-cohort').value.trim(), date = f.querySelector('#ns-date').value, slot = f.querySelector('#ns-slot').value.trim();
      if (!cohort || !date || !slot) return toast('기수·날짜·타임을 모두 입력해 주세요');
      const sid = DB.newId();
      await DB.set(`sessions/${sid}/pub`, { cohort, date, slot, status: 'ready', M: 0, F: 0, createdAt: Date.now() });
      f.querySelector('#ns-slot').value = '';
      toast('타임을 만들었어요'); openSession(sid); return;
    }
    if (kind === 'add-person') {
      const g = f.querySelector('#ap-g').value, name = f.querySelector('#ap-n').value.trim(), phone = digits(f.querySelector('#ap-p').value);
      if (!name || phone.length < 9) return toast('이름과 연락처를 확인해 주세요');
      await writeRoster([...rosterList(A.cur), { gender: g, name, phone }]);
      f.querySelector('#ap-n').value = ''; f.querySelector('#ap-p').value = '';
      toast(`${name}님을 추가했어요`); return;
    }
    if (kind === 'bulk') {
      const { out, bad } = parseBulk(f.querySelector('#bk').value);
      if (!out.length) return toast('알아볼 수 있는 줄이 없어요. 성별·이름·연락처를 확인해 주세요');
      await writeRoster([...rosterList(A.cur), ...out]);
      f.querySelector('#bk').value = bad.join('\n');
      toast(bad.length ? `${out.length}명 추가 · ${bad.length}줄은 확인이 필요해요` : `${out.length}명을 추가했어요`); return;
    }
  } catch (err) { console.error(err); toast(err.message && err.message.length < 60 ? err.message : '저장하지 못했어요. 권한과 연결을 확인해 주세요'); }
});

document.addEventListener('click', async e => {

    switch (act) {
      case 'pick': return onPick(b.dataset.id);

      case 'p-logout': sessionStorage.removeItem('eon-signal-me-' + P.sid); P.me = null; P.first = P.second = null; P.phase = 'entry'; P.err = ''; return renderP();
      case 'logout': return AUTH.signOut();

      case 'status': return setStatus(b.dataset.to);
      case 'del-person': {
        const id = b.dataset.id; const p = A.cur.roster[id];
        if (!(await confirmBox(`${p.name}님을 삭제할까요?`, '같은 성별 뒤 번호들이 하나씩 당겨져요. 번호표도 다시 확인해 주세요.', '삭제', true))) return;
        await writeRoster(rosterList(A.cur).filter(x => x.id !== id)); return toast('삭제했어요');
      }
      case 'reset-vote': {
        const id = b.dataset.id;
        if (!(await confirmBox(`${label(id)} 제출을 초기화할까요?`, '이 분은 처음부터 다시 고를 수 있어요. 참가자 폰에서는 화면을 새로고침한 뒤 다시 입장하면 돼요.', '초기화', true))) return;
        await DB.remove(`sessions/${A.sid}/votes/${id}`); return toast('초기화했어요');
      }
      case 'del-session': {
        if (!(await confirmBox('이 타임을 삭제할까요?', '명단·투표·결과가 모두 지워지고 되돌릴 수 없어요.', '삭제', true))) return;
        const sid = A.sid; goHome(); await DB.remove(`sessions/${sid}`); return toast('삭제했어요');
      }
      case 'copy': {
        const s = A.cur; const id = b.dataset.id; const me = { id, ...s.roster[id] };
        let text;
        if (b.dataset.kind === 'match') { const m = computeMatches(s.roster, s.votes).matched[id]; text = msgMatch(me, { id: m.partner, ...s.roster[m.partner] }, m.rank, s.pub); }
        else text = msgMiss(me, s.pub);
        if (await copyText(text)) { await DB.set(`sessions/${A.sid}/sent/${id}`, true); toast(`${label(id)} 문구를 복사했어요`); }
        else toast('복사하지 못했어요');
        return;
      }
      case 'csv': return exportCSV();
      case 'copy-link': return (await copyText(participantURL(A.sid))) ? toast('링크를 복사했어요') : toast('복사하지 못했어요');
      case 'print': return window.print();
      case 'demo-seed': return seedDemo();
      case 'demo-reset': if (await confirmBox('데모 데이터를 모두 지울까요?', '', '지우기', true)) { DB.reset(); toast('초기화했어요'); } return;
    }
  } catch (err) { console.error(err); toast('처리하지 못했어요. 연결과 권한을 확인해 주세요'); }
});

/* ---------- 시작 ---------- */
(function boot() {
  try { initStore(); }
  catch (e) { console.error(e); $app.innerHTML = `<div class="wrap"><p class="h2">앱을 시작하지 못했어요</p><p class="p">Firebase 설정값을 확인해 주세요.</p></div>`; return; }
  if (location.hash === '#admin') return startAdmin();
  startParticipant(new URLSearchParams(location.search).get('s'));
})();
window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
